name: Build and Push

on:
  workflow_run:
    workflows: ["CI Scan"] # only fires after ci-scan.yml finishes — never runs on its own
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required for OIDC — this is what lets the job request a GitHub token
  contents: read

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' # the actual gate — skips entirely if gitleaks/SonarCloud failed
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: 911167920081.dkr.ecr.us-east-1.amazonaws.com/my-app
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }} # the exact commit that was scanned — not a fresh checkout of main

    steps:
      - name: Checkout the scanned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Assume AWS build role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::911167920081:role/github-actions-ecr-build-push
          aws-region: us-east-1
          # no access-key-id / secret-access-key anywhere — OIDC issues short-lived creds

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1" # fails the job — the push step below never runs if this fails
          ignore-unfixed: true # don't block on CVEs with no available fix yet

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}