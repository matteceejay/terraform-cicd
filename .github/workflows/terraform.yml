
name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/dev/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/dev/**"
      - ".github/workflows/terraform.yml"

concurrency:
  group: terraform-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.15.8"
  WORKING_DIR: environments/dev

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3 — verify/pin
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Assume Terraform plan role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.DEV_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      #- name: Format check
       # run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=120s -out=tfplan
          terraform show -no-color tfplan > plan.txt
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — verify/pin
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const body = `#### Terraform Plan — dev\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-infra   # pauses here for required-reviewer approval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3 — verify/pin
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Assume Terraform apply role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.DEV_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Apply
        run: terraform apply -input=false -lock-timeout=120s tfplan
        working-directory: ${{ env.WORKING_DIR }}