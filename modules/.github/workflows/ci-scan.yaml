name: CI Scan

on: 
  push:
    branches: [ main ]
    
permissions:
  contents: read # least privilege — this workflow only reads code, never writes anything

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks checks past commits too, not just the diff

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # fails the job on any finding by default — no config needed to get that behavior

  sonarqube-scan:
    runs-on: ubuntu-latest
    needs: secrets-scan # don't waste a SonarQube scan if secrets were already found
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs history for accurate new-code analysis

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Enforce Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # this step is what actually FAILS the workflow if code quality/security
        # thresholds aren't met — the scan step above alone only uploads 